[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter-bb"
version = "3.0.0"
description = "Agent-Grade Bug Bounty Engine — adaptive scanning with smart routing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hunter Team"}
]
keywords = ["bug-bounty", "security", "scanner", "agent", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
hunter = "hunter.cli:cli"

[project.urls]
Homepage = "https://github.com/hunter-bb/hunter"
Documentation = "https://github.com/hunter-bb/hunter#readme"

[tool.setuptools.packages.find]
include = ["hunter*"]
